name: Frontend Tests

on:
  push:
    branches: [main, develop]
    paths:
      - 'apps/frontend/**'
      - 'packages/**'
      - '.github/workflows/test-frontend.yml'
  pull_request:
    branches: [main, develop]
    paths:
      - 'apps/frontend/**'
      - 'packages/**'

env:
  NEXT_PUBLIC_API_URL: http://localhost:3001
  NEXT_PUBLIC_BACKEND_URL: http://localhost:3001
  NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
  NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
  NEXTAUTH_SECRET: test-secret-key-for-ci-min-32-characters

jobs:
  check:
    name: Lint & Unit Tests
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Enable corepack
        run: corepack enable

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm --filter @aiquaa/frontend lint

      - name: Unit tests
        run: pnpm --filter @aiquaa/frontend test

  e2e:
    name: E2E Tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Solo en push a main — no en cada PR
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Enable corepack
        run: corepack enable

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright
        run: pnpm --filter @aiquaa/frontend exec playwright install chromium --with-deps

      - name: Build allpairs-core
        run: pnpm --filter @aiquaa/allpairs-core build

      - name: Build frontend
        run: pnpm --filter @aiquaa/frontend build

      - name: Run E2E
        run: pnpm --filter @aiquaa/frontend e2e
        env:
          CI: true
          FRONTEND_PORT: 3001

      - name: Upload report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: apps/frontend/playwright-report/
          retention-days: 7
