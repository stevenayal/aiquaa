name: Security Audit

on:
  pull_request:
    branches: [main, develop]
  schedule:
    - cron: '0 8 * * 1'
  workflow_dispatch:

jobs:
  audit:
    name: Dependency Audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    continue-on-error: true

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run security audit
        run: |
          pnpm audit --audit-level=high --json > audit-report.json || true
          pnpm audit --audit-level=high || true

      - name: Annotate PR with findings
        if: always()
        run: |
          if [ -f audit-report.json ]; then
            HIGH=$(node -e "
              const r = require('./audit-report.json');
              const v = r.metadata?.vulnerabilities || {};
              console.log((v.high || 0) + (v.critical || 0));
            " 2>/dev/null || echo "0")
            if [ "$HIGH" -gt "0" ]; then
              echo "::warning title=Security Vulnerabilities::$HIGH vulnerabilidades high/critical encontradas. Correr 'pnpm audit' localmente para ver detalles."
            else
              echo "::notice title=Security Audit::Sin vulnerabilidades high/critical."
            fi
          fi

      - name: Upload audit report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: security-audit-report
          path: audit-report.json
          retention-days: 30
